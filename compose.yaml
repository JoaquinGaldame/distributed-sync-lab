services:

  postgres:
    image: postgres:17
    container_name: sync-lab-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/compose/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: